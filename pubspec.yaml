name: auri
description: Standalone text-to-speech reader with device voices and API MP3 export.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  file_picker: ^13.2.0
  pdfrx: ^2.4.8
  archive: ^4.6.0
  crypto: ^3.0.8
  xml: ^7.0.1
  html: ^0.15.7
  http: ^1.6.0
  just_audio: ^0.10.6
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  # 1.13.8, not 2.x: 2.0 dropped the espeak-ng fallback, so Kokoro there
  # silently skips every word missing from its lexicon (names, numbers).
  sherpa_onnx: 1.13.8
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
