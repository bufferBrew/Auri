# Keep the soundwave centered inside adaptive launcher masks.
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  adaptive_icon_background: "#050507"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
  adaptive_icon_foreground_inset: 12
  ios: false
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#090C23"
    theme_color: "#090C23"
  windows:
    generate: false
    icon_size: 256
  macos:
    generate: false
